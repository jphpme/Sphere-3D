name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  # `claude/**` alongside main so a stacked PR — one targeting another
  # branch rather than main — is analysed rather than skipped. See the
  # longer note in ci.yml: the checks were not failing on those PRs,
  # they were never running.
  pull_request:
    branches: [ "main", "claude/**" ]
  schedule:
    - cron: '35 14 * * 6'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          # No rust: the fork dropped the Tauri desktop app (src-tauri),
          # the only Rust in the repo, and CodeQL fails a language it
          # finds no source for.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # `paths`/`paths-ignore` are only honored inside the config
          # file — they are NOT valid inputs to this step, so an inline
          # `paths-ignore:` here is silently ignored. Exclusions live in
          # the config file below.
          config-file: ./.github/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
