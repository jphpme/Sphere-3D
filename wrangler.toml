# Cloudflare Pages configuration

name = "ayni-vr"
compatibility_date = "2024-12-01"
pages_build_output_dir = "dist"

[vars]
REALTIME_FREE_WEEKLY_SECONDS = "1200"
REALTIME_QUOTA_SEGMENT_SECONDS = "10"

# Workers AI.
#
# `AI` is the binding behind the Orbit chat proxy, voice STT/TTS,
# dataset embeddings, event enrichment and blog drafting: all of it on
# the free allocation (~10k neurons/day), none of it needing a key.
#
# Declared here because Cloudflare manages this project's bindings
# through this file. The dashboard refuses edits — "Bindings for this
# project are being managed through wrangler.toml" — so a binding that
# is not in this file does not exist in the deployment. That is not
# theoretical: `AI` used to be wired in the dashboard by hand, and when
# the project moved to config-file bindings it silently stopped
# existing. The symptoms were three different failures for one cause —
# `/api/models` answered 503 "AI binding not configured",
# `/api/v1/search` answered 200 with `Warning: search degraded:
# unconfigured`, and the chat proxy returned a bare 502 that the SPA
# could only render as "AI service unavailable — showing offline
# results". Every other binding below was already declared here, which
# is why only the AI features were dark.
#
# The cost of declaring it, and the reason it was left out before:
# wrangler opens an authenticated remote session for an AI binding, so
# `npm run dev:functions` wants `wrangler login` before it will serve.
# `npm run dev` (the SPA alone) is unaffected, and offline work on the
# bindings keeps working through the mocks (`MOCK_AI=true` with
# `MOCK_VECTORIZE=true` for the embedding path) — `npm run
# dev:functions:ai` is the same binding passed as `--ai AI` when a real
# one is wanted locally.
[ai]
binding = "AI"

# D1 database for storing AI feedback (thumbs up/down ratings)
[[d1_databases]]
binding = "FEEDBACK_DB"
database_name = "sphere-feedback"
database_id = "c07fe2a5-bff9-41ea-b594-376d31c10141"
migrations_dir = "migrations"

# Catalog backend (Phase 1a onward) — datasets, tours, publishers,
# audit_events. Same physical D1 instance as FEEDBACK_DB above
# (per CATALOG_BACKEND_PLAN.md "Cloudflare service mapping": "Same
# DB instance as FEEDBACK_DB, separate tables"); the second binding
# exists so the catalog migrations live under their own directory
# and can be applied independently with
# `wrangler d1 migrations apply CATALOG_DB`.
#
# Declared here because this project's bindings are managed from this
# file (see the `AI` block above): what is written below is what the
# deployment gets, not documentation for a dashboard step.
[[d1_databases]]
binding = "CATALOG_DB"
database_name = "sphere-feedback"
database_id = "c07fe2a5-bff9-41ea-b594-376d31c10141"
migrations_dir = "migrations/catalog"

# Analytics Engine dataset for the telemetry event stream.
# Every datapoint written by functions/api/ingest.ts lands here.
# Query via the AE SQL API; see docs/ANALYTICS_QUERIES.md.
#
# Commented out means **absent from the deployment**, not merely
# undocumented: the file is the whole binding set now. Enable Analytics
# Engine on the account, uncomment the block below, and redeploy to
# start ingesting; the globe runs without it either way.
# Enable Analytics Engine in the Cloudflare dashboard before restoring this
# binding. The globe can deploy and run without analytics ingestion.
# [[analytics_engine_datasets]]
# binding = "ANALYTICS"
# dataset = "terraviz_events"

# KV namespace for the runtime telemetry kill switch. The ingest
# endpoint reads the key `telemetry_enabled` on every request; when
# set to `disabled` / `false` / `off` / `0`, clients receive 410 Gone
# and cool down for the rest of the session. Absent or any other
# value = allow.
#
# Declared, not commented out, because the file is authoritative for
# this project's bindings — the kill switch is live in the deployment
# and `wrangler kv key put` above reaches the same namespace.
#
# Operations:
#   - Activate (clients receive 410):
#       wrangler kv key put telemetry_enabled disabled \
#         --namespace-id=cb678d8a3f4d4afda5924d503fa185d3
#   - Deactivate (back to normal):
#       wrangler kv key delete telemetry_enabled \
#         --namespace-id=cb678d8a3f4d4afda5924d503fa185d3
[[kv_namespaces]]
binding = "TELEMETRY_KILL_SWITCH"
id = "cb678d8a3f4d4afda5924d503fa185d3"

# KV namespace for the catalog read API's hot-path snapshot cache.
# `functions/api/v1/catalog.ts` lazily renders the public catalog
# response and caches it under a single key keyed by ETag. Cache is
# invalidated on every publish / retract (wired in Commit F).
# Without this snapshot, `/api/v1/catalog` would issue ~5 D1 queries
# per browse-page load and burn the 5 M-row-reads/day free-tier
# budget — see "Free-tier viability" in CATALOG_BACKEND_PLAN.md.
#
# The namespace ID above is what the deployment binds — if it was ever a
# placeholder, the binding exists but its cache is empty (every read
# misses). Create the namespace with `wrangler kv namespace create
# CATALOG_KV` and paste the real ID here before deploying.
[[kv_namespaces]]
binding = "CATALOG_KV"
id = "07b41256ec53465a9211f60b1132c39d"

# Weekly free-tier metering for same-origin realtime DASH playback.
# `/dash/**` and `/realtime/**` media segment requests decrement this
# KV-backed allowance; forecast, manifest, thumbnail, legend, and DSA
# requests are not charged. Declared here, so it is present in the
# deployment; the ID above is the live namespace.
#
[[kv_namespaces]]
binding = "REALTIME_QUOTA_KV"
id = "fc9ecc345f8a4f078469ceba7d9c78fe"

# R2 bucket for catalog assets (Phase 1b onward) — sphere thumbnails,
# image data refs, legends, captions, and tour JSON. Stream handles
# video uploads via its own API (see STREAM_ACCOUNT_ID +
# STREAM_API_TOKEN secrets); R2 carries everything else. Keys are
# content-addressed (`datasets/{id}/by-digest/sha256/{hex}/asset.{ext}`)
# per `docs/CATALOG_ASSETS_PIPELINE.md`, so revisions land at new
# paths without invalidating existing caches.
#
# Two parallel access modes:
#   - The Workers binding below is what server-side handlers use to
#     read just-uploaded bytes and verify `content_digest`. Wrangler
#     provisions a local on-disk bucket under
#     `.wrangler/state/v3/r2/` even without real R2 credentials, so
#     tests + dev work offline.
#   - Browser / CLI uploads use S3-compatible presigned PUT URLs
#     minted by `functions/api/v1/_lib/r2-store.ts`. That path needs
#     `R2_S3_ENDPOINT`, `R2_ACCESS_KEY_ID`, and `R2_SECRET_ACCESS_KEY`
#     in `.dev.vars` (or `MOCK_R2=true` for the contributor
#     walkthrough, which skips signing).
#
# Declared here, so the deployment binds this bucket. The bucket name
# override knob is `CATALOG_R2_BUCKET` in `.dev.vars` (default
# `terraviz-assets`, matching `bucket_name` below).
[[r2_buckets]]
binding = "CATALOG_R2"
bucket_name = "terraviz-assets"

# Vectorize index for the docent's semantic search, Phase 1c
# onward. Holds 768-dim embeddings — one per published dataset —
# produced from `@cf/baai/bge-base-en-v1.5` against the canonical
# embedding text built in `functions/api/v1/_lib/embeddings.ts`.
# `_lib/vectorize-store.ts` is the only Workers-side consumer:
# `upsertEmbedding` on publish/update, `deleteEmbedding` on retract,
# `queryEmbedding` from the public `/api/v1/search?q=` endpoint and
# the docent's `search_datasets` tool path.
#
# The Vectorize index itself is provisioned out-of-band via:
#
#   wrangler vectorize create terraviz-datasets \
#     --dimensions=768 --metric=cosine
#   wrangler vectorize create-metadata-index terraviz-datasets \
#     --property-name=peer_id --type=string
#   wrangler vectorize create-metadata-index terraviz-datasets \
#     --property-name=category --type=string
#   wrangler vectorize create-metadata-index terraviz-datasets \
#     --property-name=visibility --type=string
#
# The contributor walkthrough does NOT need a real index: setting
# `MOCK_VECTORIZE=true` in `.dev.vars` swaps the binding for an
# in-memory mock that implements cosine similarity end-to-end. See
# `docs/CATALOG_BACKEND_DEVELOPMENT.md` for the full setup.
#
# Declared here, so the deployment binds this index. Local
# `wrangler pages dev` reports Vectorize as "not supported", which is
# what `MOCK_VECTORIZE=true` is for.
[[vectorize]]
binding = "CATALOG_VECTORIZE"
index_name = "terraviz-datasets"

# --- Orbit voice (Phase 2) ---
#
# The voice Pages Functions (/api/voice/transcribe, /api/voice/synthesize)
# run STT/TTS on the same `AI` binding above — no extra binding needed.
#
# KILL_VOICE is a plain environment variable (not a binding) and a
# kill switch: set it to a deny value (`1` / `true` / `on` /
# `disabled`) in the Pages dashboard (Settings → Variables) to make
# both voice endpoints return 503 so clients cool down and fall back
# to the browser engine. Absent / any other value = voice enabled.
# See docs/ORBIT_VOICE_PLAN.md §6, §8 (decision 4).
#
# --- Orbit voice realtime streaming (Phase 3) ---
#
# /api/voice/stream proxies a browser WebSocket to Cloudflare's AI
# Gateway realtime endpoint (Deepgram Nova-3/Flux) for live interim
# transcripts. Configure in the Pages dashboard (Settings → Variables);
# absent any of these (or with KILL_VOICE set) the route accepts the
# socket and sends a JSON error frame ({type:"error",code}) before
# closing — a browser WebSocket can't read an HTTP status — so the
# client disables WS streaming for the session and the resolver falls
# back to the batch Whisper engine. That makes this opt-in:
#   CF_ACCOUNT_ID     - Cloudflare account id (plain var)
#   CF_AI_GATEWAY     - AI Gateway name (plain var)
#   CF_AIG_TOKEN      - AI Gateway authorization, the `cf-aig-authorization`
#                       value (store as an ENCRYPTED secret, never plaintext)
#   VOICE_STREAM_MODEL - optional override, defaults to @cf/deepgram/nova-3
# See docs/ORBIT_VOICE_PLAN.md §3 and
# https://developers.cloudflare.com/ai-gateway/usage/websockets-api/realtime-api/
